apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: clone-build-push-deploy-run-
spec:
  serviceAccountName: pipeline-sa
  pipelineRef:
    name: clone-build-push-deploy
  podTemplate:
    securityContext:
      fsGroup: 65532
  params:
    - name: repo-url
      value: git@github.com:nemcikjan/fri-uniza-onpk-cicd.git    # your fork (SSH url)
    - name: repo-revision
      value: "main"
    - name: image-name
      value: "ghcr.io/nemcikjan/fri-uniza-onpk-cicd"                 # lowercase
    - name: image-tag
      value: "1.0.0"
    - name: build-extra-args
      value: ""
  workspaces:
    - name: shared-data
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    - name: git-credentials
      secret:
        secretName: git-credentials
    - name: dockerconfig
      secret:
        secretName: docker-credentials

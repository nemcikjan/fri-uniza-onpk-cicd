{{- /* Single-node MongoDB from the official image. The name must match DB_HOST in deployment.yaml. */ -}}
{{- $name := printf "%s-mongodb" .Release.Name -}}
{{- with .Values.mongodb.auth.rootUser }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "appbackend.labels" $ | nindent 4 }}
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: {{ . | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ required "mongodb.auth.rootPassword is required when rootUser is set" $.Values.mongodb.auth.rootPassword | quote }}
---
{{- end }}
{{- with .Values.mongodb.initdbScripts }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-initdb
  labels:
    {{- include "appbackend.labels" $ | nindent 4 }}
data:
  {{- toYaml . | nindent 2 }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "appbackend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: mongodb
      protocol: TCP
      name: mongodb
  selector:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "appbackend.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # restart MongoDB when the credentials or init scripts change
        checksum/config: {{ toJson (pick .Values.mongodb "auth" "initdbScripts") | sha256sum }}
    spec:
      containers:
        - name: mongodb
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          imagePullPolicy: {{ .Values.mongodb.image.pullPolicy }}
          {{- if .Values.mongodb.auth.rootUser }}
          envFrom:
            - secretRef:
                name: {{ $name }}
          {{- end }}
          ports:
            - name: mongodb
              containerPort: 27017
              protocol: TCP
          # TCP probes: simpler and more reliable than running mongosh in the probe
          livenessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.mongodb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data/db
            {{- if .Values.mongodb.initdbScripts }}
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
            {{- end }}
      volumes:
        # No persistence: data is lost when the pod restarts, which is fine for the lab
        - name: data
          emptyDir: {}
        {{- if .Values.mongodb.initdbScripts }}
        - name: initdb
          configMap:
            name: {{ $name }}-initdb
        {{- end }}
